<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <!-- Ceramic Clay Drop Shadow -->
    <filter id="clayShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3.5" stdDeviation="3" flood-color="#00332B" flood-opacity="0.32" />
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#00332B" flood-opacity="0.18" />
    </filter>

    <!-- Styleguide Electric Mint Gradient (#00F7D8 -> #00A791) -->
    <linearGradient id="mintTileGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F7D8" />
      <stop offset="45%" stop-color="#00DCBB" />
      <stop offset="100%" stop-color="#00A791" />
    </linearGradient>

    <!-- Ceramic Inset Top Bevel Light -->
    <linearGradient id="bevelLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85" />
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- Monogram Tactile Drop Shadow -->
    <filter id="glyphShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#003D33" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Tactile Mint Ceramic Tile -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#mintTileGrad)" filter="url(#clayShadow)" />
  <rect x="5.5" y="5.5" width="53" height="53" rx="14.5" stroke="url(#bevelLight)" stroke-width="1.4" />

  <!-- The Sculptural 'R' Monogram -->
  <g filter="url(#glyphShadow)">
    <!-- Left Column (Document Spine) -->
    <rect x="15" y="15" width="8.5" height="34" rx="4.25" fill="#FFFFFF" />

    <!-- Document Reading Micro-Lines -->
    <rect x="17.25" y="21.5" width="4" height="1.6" rx="0.8" fill="#00A791" opacity="0.7" />
    <rect x="17.25" y="25.5" width="4" height="1.6" rx="0.8" fill="#00A791" opacity="0.7" />
    <rect x="17.25" y="29.5" width="4" height="1.6" rx="0.8" fill="#00A791" opacity="0.7" />
    <rect x="17.25" y="33.5" width="2.5" height="1.6" rx="0.8" fill="#00A791" opacity="0.7" />

    <!-- Upper Loop (Optic Housing) -->
    <path d="M23.5 15H35.5C41.3 15 46 19.7 46 25.5C46 31.3 41.3 36 35.5 36H23.5V15Z" fill="#FFFFFF" />
    
    <!-- Optical Lens Cavity & Glowing Focus Iris -->
    <circle cx="35" cy="25.5" r="5.5" fill="#0E141D" />
    <circle cx="35" cy="25.5" r="2.2" fill="#00FFEB" />

    <!-- Lower Leg (Dynamic Page Sweep) -->
    <path d="M30 33.5L42.5 47" stroke="#FFFFFF" stroke-width="7.5" stroke-linecap="round" />
  </g>
</svg>